<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 368 236" fill="none">
  <defs>
    <!-- Vibrant Blue Facet Gradient -->
    <linearGradient id="mBlueGrad" x1="50" y1="20" x2="200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="40%" stop-color="#0052E0"/>
      <stop offset="100%" stop-color="#0035A0"/>
    </linearGradient>

    <!-- Deep Navy / Cyber Night Shading -->
    <linearGradient id="mNavyGrad" x1="350" y1="20" x2="200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07204A"/>
      <stop offset="60%" stop-color="#03102A"/>
      <stop offset="100%" stop-color="#020816"/>
    </linearGradient>

    <!-- Soft Glow Filter for Constellation Nodes -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- M GLYPH: 3D Faceted Geometry -->
  <g id="faceted-m">
    <!-- Left Top Cyan/Blue Facet (Outer angle dipping to center) -->
    <polygon points="60,20 200,180 150,220 20,70" fill="#0066FF" />
    
    <!-- Left Inner Dark-Navy Pillar -->
    <polygon points="20,70 60,20 60,240 20,200" fill="#05193B" />
    <polygon points="60,240 20,200 20,70 60,20" fill="#05193B" />

    <!-- Center Left Bottom Fold -->
    <polygon points="150,220 200,180 200,245 150,220" fill="#003D9E" />

    <!-- Right Top Dark/Midnight Facet -->
    <polygon points="340,20 200,180 250,220 380,70" fill="#0A3275" />

    <!-- Right Deep Navy Outer Pillar -->
    <polygon points="380,70 340,20 340,240 380,200" fill="#020C1F" />
    
    <!-- Center Right Bottom Fold -->
    <polygon points="250,220 200,180 200,245 250,220" fill="#020817" />
  </g>

  <!-- CONSTELLATION NETWORK MESH (The white glowing nodes and interconnected data links) -->
  <g id="constellation" stroke="#E6F2FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Web of links across the V-cavity -->
    <line x1="50" y1="125" x2="85" y2="108" opacity="0.9" />
    <line x1="85" y1="108" x2="135" y2="145" opacity="0.9" />
    <line x1="135" y1="145" x2="175" y2="190" opacity="0.95" />
    <line x1="85" y1="108" x2="110" y2="185" opacity="0.85" />
    <line x1="110" y1="185" x2="175" y2="190" opacity="0.9" />
    <line x1="175" y1="190" x2="200" y2="148" opacity="0.95" />
    <line x1="200" y1="148" x2="265" y2="108" opacity="0.9" />
    <line x1="265" y1="108" x2="285" y2="185" opacity="0.9" />
    <line x1="200" y1="148" x2="285" y2="185" opacity="0.9" />
    <line x1="285" y1="185" x2="350" y2="125" opacity="0.9" />
    <line x1="265" y1="108" x2="350" y2="125" opacity="0.85" />

    <!-- Pure White Data Terminals -->
    <circle cx="50" cy="125" r="4.5" fill="#FFFFFF" />
    <circle cx="85" cy="108" r="5" fill="#FFFFFF" />
    <circle cx="110" cy="185" r="4.5" fill="#FFFFFF" />
    <circle cx="135" cy="145" r="5" fill="#FFFFFF" />
    <circle cx="175" cy="190" r="5.5" fill="#FFFFFF" filter="url(#nodeGlow)" />
    <circle cx="200" cy="148" r="5" fill="#FFFFFF" />
    <circle cx="265" cy="108" r="5.5" fill="#FFFFFF" filter="url(#nodeGlow)" />
    <circle cx="285" cy="185" r="4.5" fill="#FFFFFF" />
    <circle cx="350" cy="125" r="4.5" fill="#FFFFFF" />
  </g>
</svg>
